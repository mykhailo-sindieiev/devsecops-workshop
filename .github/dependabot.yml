version: 2

# Days are staggered so the five ecosystems don't all open PRs at once.
updates:
  # ----- application dependencies -----

  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5

  # ----- base images -----
  # Bumps the FROM tag. Note it tracks the existing tag series, so it will
  # offer python:3.9.x patches but will not jump 3.9 -> 3.13.

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3

  # ----- CI -----
  # Keeps the `uses:` pins current, which is also what Semgrep's
  # github-actions-mutable-action-tag findings are about.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 5
