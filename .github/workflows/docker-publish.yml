name: Build and Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push api
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/devsecops-workshop-api:latest ./api
          docker push ${{ vars.DOCKERHUB_USERNAME }}/devsecops-workshop-api:latest

      - name: Build and push frontend
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/devsecops-workshop-frontend:latest ./frontend
          docker push ${{ vars.DOCKERHUB_USERNAME }}/devsecops-workshop-frontend:latest
