name: Build and Push Images

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
      # Git tag push -> use the tag name; anything else -> latest.
      IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push api
        run: |
          docker build -t "$NAMESPACE/devsecops-workshop-api:$IMAGE_TAG" ./api
          docker push "$NAMESPACE/devsecops-workshop-api:$IMAGE_TAG"

      - name: Build and push frontend
        run: |
          docker build -t "$NAMESPACE/devsecops-workshop-frontend:$IMAGE_TAG" ./frontend
          docker push "$NAMESPACE/devsecops-workshop-frontend:$IMAGE_TAG"
