name: Build and Push Images

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # for the SARIF uploads to code scanning

    env:
      NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
      # Git tag push -> use the tag name; anything else -> latest.
      IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.73.0

      # ----- api -----

      - name: Build api
        run: docker build -t "$NAMESPACE/devsecops-workshop-api:$IMAGE_TAG" ./api

      # Scan once into JSON, then convert. `trivy convert` re-renders an
      # existing report, so the table and SARIF cost no extra scan.
      # Informational only: no --exit-code, so findings never fail the build.
      - name: Scan api image
        run: |
          trivy image \
            --format json \
            --output trivy-api.json \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            "$NAMESPACE/devsecops-workshop-api:$IMAGE_TAG"
          trivy convert --format table trivy-api.json
          trivy convert --format sarif --output trivy-api.sarif trivy-api.json

      # Image-level SBOM: includes the Alpine OS packages, which a
      # source-manifest SBOM (cdxgen) does not see.
      - name: Generate api image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/devsecops-workshop-api:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          format: cyclonedx
          output: sbom-api-image.json

      - name: Push api
        run: docker push "$NAMESPACE/devsecops-workshop-api:$IMAGE_TAG"

      # ----- frontend -----

      - name: Build frontend
        run: docker build -t "$NAMESPACE/devsecops-workshop-frontend:$IMAGE_TAG" ./frontend

      - name: Scan frontend image
        run: |
          trivy image \
            --format json \
            --output trivy-frontend.json \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            "$NAMESPACE/devsecops-workshop-frontend:$IMAGE_TAG"
          trivy convert --format table trivy-frontend.json
          trivy convert --format sarif --output trivy-frontend.sarif trivy-frontend.json

      - name: Generate frontend image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/devsecops-workshop-frontend:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          format: cyclonedx
          output: sbom-frontend-image.json

      - name: Push frontend
        run: docker push "$NAMESPACE/devsecops-workshop-frontend:$IMAGE_TAG"

      # ----- reporting -----

      # Each upload needs its own category. Without it, the second upload
      # replaces the first one's alerts -- including Semgrep's.
      - name: Upload api SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Upload frontend SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      # Separate test_title per image so reimport updates the right test
      # instead of the two images overwriting each other.
      - name: Publish Trivy results to DefectDojo
        env:
          DD_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          DD_PRODUCT: devsecops-workshop
          DD_ENGAGEMENT: main-branch-containers
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          BUILD_ID: ${{ github.run_id }}
        run: |
          upload() {
            local file="$1" title="$2"
            echo "Uploading ${file} as test '${title}'"
            curl -sS --fail-with-body \
              -X POST "${DD_URL%/}/api/v2/reimport-scan/" \
              -H "Authorization: Token ${DD_TOKEN}" \
              -F "scan_type=Trivy Scan" \
              -F "file=@${file}" \
              -F "product_name=${DD_PRODUCT}" \
              -F "engagement_name=${DD_ENGAGEMENT}" \
              -F "test_title=${title}" \
              -F "auto_create_context=true" \
              -F "close_old_findings=true" \
              -F "active=true" \
              -F "verified=false" \
              -F "branch_tag=${BRANCH}" \
              -F "commit_hash=${COMMIT}" \
              -F "build_id=${BUILD_ID}"
            echo
          }

          upload trivy-api.json trivy-api
          upload trivy-frontend.json trivy-frontend

      - name: Upload image SBOMs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-sbom
          path: sbom-*-image.json
